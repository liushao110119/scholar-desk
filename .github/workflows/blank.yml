name: 构建 Windows 安装包

# 用途：推送 tag 或手动触发时，用 GitHub 的 Windows 机器自动打包，
# 产物在 Actions 页面直接下载。这样你本机完全不用装打包环境。
#
# 触发方式：
#   1) 打 tag：git tag v0.1.0 && git push origin v0.1.0
#   2) 手动：GitHub 仓库 → Actions → 构建 Windows 安装包 → Run workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install
        env:
          # 国内镜像兜底；GitHub 机器走官方源也很快，这里只是保险
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 生成图标
        run: python scripts/make-icon.py
        continue-on-error: true

      - name: 运行自测
        run: npm test

      - name: 打包（安装版 + 便携版）
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScholarDesk-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: 随 Release 发布
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

